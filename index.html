<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갈릭스 라이브 아카이브</title>
<meta name="description" content="GARLIXX 공연 · 셋리스트 · 곡 기록">
<meta name="theme-color" content="#F6F1E9">
<meta property="og:title" content="GARLIXX LIVE ARCHIVE">
<meta property="og:description" content="갈릭스 공연 · 셋리스트 · 곡 기록">
<meta property="og:image" content="img/seal.png">
<link rel="icon" href="img/seal.png">
<link rel="apple-touch-icon" href="img/seal.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap">
<style>
:root{
  --bg:#F6F1E9;--card:#FFFDF9;--ink:#211C17;--ink2:#3A332C;--sub:#8C8378;--line:#ECE4D8;--soft:#F1EADF;
  --yel:#FFCF3F;--yel2:#FFF3C9;--mus:#B98A00;--red:#D9483B;--redbg:#FCEBE8;
  --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-0.2px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(246,241,233,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;cursor:pointer}
.logo img{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.lt b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.5px;line-height:1}
.lt small{display:block;font-size:9px;font-weight:700;letter-spacing:2.6px;color:var(--sub);margin-top:4px}
.hr{display:flex;align-items:center;gap:6px}
#sync{font-size:11px;color:var(--sub);margin-right:4px}
.snsl{font-size:10px;font-weight:700;color:var(--sub);text-align:right;line-height:1.25;margin-right:2px;letter-spacing:-.2px}
.sns{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--ink);transition:transform .15s}
.sns:active{transform:scale(.92)}
.sns svg{width:18px;height:18px;display:block}
main{padding:4px 16px 120px;max-width:680px;margin:0 auto}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;background:var(--ink);border-radius:99px;display:flex;padding:6px;gap:2px;box-shadow:0 10px 30px rgba(33,28,23,.28);width:min(360px,calc(100% - 32px))}
nav button{flex:1;background:none;border:none;color:rgba(255,248,236,.55);font-size:10.5px;font-weight:600;padding:7px 0 6px;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:21px;height:21px;display:block}
nav button.on{color:var(--ink);background:var(--yel)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line)}
.tap{cursor:pointer}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin:28px 4px 10px;gap:8px}
.sec h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px}
.sec h2 em{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:13px;color:var(--mus);letter-spacing:0;margin-bottom:2px}
.more{background:none;border:none;color:var(--sub);font-size:13px;padding:4px;cursor:pointer}
.sub{color:var(--sub);font-size:13px}

.hero{background:var(--ink);color:#FFF8EC;border-radius:26px;padding:22px 20px 20px;margin-top:6px;position:relative;overflow:hidden;isolation:isolate}
.hero:before{content:'';position:absolute;width:320px;height:320px;right:-120px;top:-150px;background:radial-gradient(circle,rgba(255,207,63,.38),rgba(255,207,63,0) 65%);z-index:-1;animation:glow 7s ease-in-out infinite}
.hero.stage:before{width:520px;height:520px;right:-180px;top:-220px;background:radial-gradient(circle,rgba(255,207,63,.6),rgba(255,207,63,0) 62%)}
@keyframes glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.hero .kick{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--yel);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-family:'Pretendard Variable',Pretendard,sans-serif;font-style:normal;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,248,236,.12);color:#FFF8EC}
.pill.yel{background:var(--yel);color:var(--ink)}
.hero .dday{font-family:var(--serif);font-size:64px;font-weight:600;letter-spacing:-2px;line-height:1;margin-top:14px}
.hero .title{font-size:20px;font-weight:800;margin-top:12px;line-height:1.35;letter-spacing:-.5px;padding-right:84px}
.hero .meta{font-size:13px;color:rgba(255,248,236,.7);margin-top:6px;line-height:1.5}
.stk{position:absolute;right:16px;top:16px;width:92px;height:92px;background:#fff;border-radius:24px;padding:6px;overflow:hidden;transform:rotate(7deg);box-shadow:0 10px 24px rgba(0,0,0,.35);animation:stick 4.5s ease-in-out infinite;pointer-events:none}
.stk img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes stick{0%,100%{transform:rotate(7deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
.spk{position:absolute;color:var(--yel);font-style:normal;font-size:13px;opacity:0;animation:twinkle 3.2s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.hero .actions{margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border-radius:18px;padding:14px 8px 12px;text-align:center;box-shadow:0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15}
.stat span{font-size:11px;color:var(--sub);font-weight:600}
.me{background:var(--yel2);box-shadow:0 0 0 1.5px var(--yel) inset}
.me .stat{background:rgba(255,255,255,.7);box-shadow:none}

.band{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:18px 6px 16px}
.mem{text-align:center;cursor:pointer;position:relative;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.mimg{width:62px;height:62px;margin:0 auto;border-radius:50%;overflow:hidden;background:#fff;position:relative}
.mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mimg.boing{animation:boing .55s ease}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.2,.82)}60%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
.pf{position:absolute;left:50%;top:31px;width:12px;height:13px;margin:-6.5px 0 0 -6px;pointer-events:none;z-index:3;animation:pf .8s cubic-bezier(.15,.75,.3,1) forwards}
.pf svg{width:100%;height:100%;display:block}
.pf.em{width:20px;height:20px;margin:-10px 0 0 -10px;font-size:15px;line-height:20px;text-align:center}
@keyframes pf{0%{transform:translate(0,0) scale(.3) rotate(0deg);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
.sp{position:absolute;left:50%;top:-6px;font-size:11px;font-weight:800;line-height:1;background:#fff;padding:4px 8px;border-radius:99px;white-space:nowrap;box-shadow:0 3px 10px rgba(33,28,23,.18);pointer-events:none;z-index:4;animation:sp 1.3s ease forwards}
@keyframes sp{0%{transform:translate(-50%,10px) scale(.3);opacity:0}20%{transform:translate(-50%,-14px) scale(1.1);opacity:1}35%{transform:translate(-50%,-10px) scale(1)}80%{transform:translate(-50%,-10px) scale(1);opacity:1}100%{transform:translate(-50%,-18px) scale(.9);opacity:0}}
.mname{font-weight:800;font-size:14px;margin-top:9px}
.mrole{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:5px;padding:0 1px}
.mrole span{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}

.srow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child,.sl:last-child{border-bottom:none}
.dblk{width:50px;flex:none;text-align:center;background:var(--soft);border-radius:14px;padding:7px 0 6px}
.dblk .d{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.05}
.dblk .m{font-size:10px;color:var(--sub);margin-top:2px;font-weight:600}
.sinfo{flex:1;min-width:0}
.st{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{font-size:12px;color:var(--sub);margin-top:3px}
.mini{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2);margin:5px 4px 0 0;font-weight:600}
.mini.yel{background:var(--yel2);color:#7A5B00}
.dpill{flex:none;font-size:12px;font-weight:800;color:var(--ink);background:var(--yel2);padding:5px 10px;border-radius:99px}
.chev{flex:none;color:#CFC6B8;font-size:20px}
.seg{display:flex;background:#EAE2D5;border-radius:14px;padding:3px;gap:3px;flex:1}
.seg button{flex:1;border:none;background:none;padding:9px 4px;border-radius:11px;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.month{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--mus);margin:22px 6px 8px}
.btn{background:var(--ink);color:#FFF8EC;border:none;border-radius:16px;padding:15px;font-size:15px;width:100%;font-weight:700;cursor:pointer}
.btn.gray{background:#E9E1D4;color:var(--ink)}
.btn2{background:var(--soft);color:var(--ink);border:none;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;text-decoration:none;cursor:pointer}
.btn2.danger{background:var(--redbg);color:var(--red)}
.btn2.on{background:var(--ink);color:#FFF8EC}
.btn2.yel{background:var(--yel);color:var(--ink)}
.btn2.glass{background:rgba(255,248,236,.12);color:#FFF8EC}
.btn2.glass.danger{background:rgba(217,72,59,.35)}
.btn2.white{background:#FFF8EC;color:var(--ink);padding:12px 18px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);color:var(--ink);border:none;border-radius:99px;padding:9px 13px;font-size:14px;cursor:pointer}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin:5px 0 12px;background:var(--bg);font-family:inherit;color:var(--ink)}
input:focus{outline:none;border-color:var(--ink);background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row input{margin:0}
label{font-size:13px;color:var(--sub);font-weight:600}
.num{flex:none;width:26px;text-align:center;font-family:var(--serif);font-style:italic;font-size:17px;font-weight:600;color:var(--mus)}
.sl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--yel);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.divider{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--mus);margin:12px 0 2px}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--line)}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;background:#eee;margin-left:6px;vertical-align:middle;font-weight:700}
.rare{background:var(--yel2);color:#7A5B00}
.warn{background:var(--redbg);color:var(--red)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--ink);border-radius:99px}
.back{background:none;border:none;color:var(--ink);font-size:15px;padding:8px 0 4px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:28px 10px;line-height:1.6}
.rank{flex:none;width:24px;text-align:center;font-family:var(--serif);font-weight:600;color:#C9BFAF;font-size:17px}
.cnt{flex:none;font-family:var(--serif);font-weight:600;font-size:20px}
.cnt small{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:11px;color:var(--sub);font-weight:600;margin-left:1px}
.center{text-align:center;padding:60px 0;color:var(--sub);line-height:1.7}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:2px 14px;margin-top:10px;box-shadow:0 0 0 1px var(--line)}
.search input{border:none;background:none;margin:0;padding:12px 0;flex:1}
.search input:focus{background:none}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;overflow-x:auto;padding-top:6px}
.col{flex:none;width:30px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cb{width:18px;border-radius:6px 6px 3px 3px;background:var(--ink)}
.cb.hi{background:var(--yel)}
.cv{font-size:11px;font-weight:800;margin-bottom:3px;min-height:14px}
.cl{font-size:10px;color:var(--sub);margin-top:6px;white-space:nowrap}
.pt{padding:10px 0;border-bottom:1px solid var(--line)}
.pt:first-child{padding-top:0}
.pt:last-child{border-bottom:none;padding-bottom:0}
.ptt{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px}
.bd{display:flex;align-items:center;gap:10px;background:var(--b);border-radius:18px;padding:12px 14px;margin-top:10px}
.bdi{font-size:20px}
.bdt{flex:1;font-size:14px;font-weight:700}
.bdd{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--c);padding:4px 9px;border-radius:99px}
.bd.today{background:var(--c);color:#fff}
.bd.today .bdd{background:#fff;color:var(--c)}
.cal .row b{font-size:15px}
.cal .more{font-size:22px;padding:0 12px;color:var(--ink)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.cw{font-size:11px;color:var(--sub);font-weight:700;padding:2px 0}
.cd{position:relative;height:38px;border-radius:12px;font-size:13px;display:flex;align-items:center;justify-content:center}
.cd.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd.has{background:var(--ink);color:var(--yel);font-weight:800;cursor:pointer}
.cd.has.past{background:var(--soft);color:var(--ink)}
.cd i{position:absolute;top:-4px;right:-2px;font-size:12px;font-style:normal}
.luck{text-align:center}
.luck .lq{font-size:40px;margin:6px 0 2px}
.luck.flip{animation:flip .6s ease}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg);opacity:.3}100%{transform:perspective(600px) rotateY(0);opacity:1}}
.lm{font-size:13px;font-weight:800;margin-top:10px}
.ll{font-size:15px;font-weight:600;line-height:1.6;margin:8px 4px 14px;word-break:keep-all}
.lsg{display:flex;gap:8px}
.lsg div{flex:1;background:var(--soft);border-radius:16px;padding:10px 6px;min-width:0}
.lsg small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.lsg b{display:block;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{white-space:pre-wrap;word-break:break-all;font-size:14px;margin-top:3px;line-height:1.5}
.nrow{display:flex;align-items:center;gap:10px;background:var(--yel);border-radius:18px;padding:10px 10px 10px 14px;margin-top:10px;color:var(--ink);text-decoration:none;cursor:pointer}
.nrow .nb{flex:none;font-size:11px;font-weight:800;background:var(--ink);color:var(--yel);padding:3px 8px;border-radius:99px}
.nrow .nt{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .ni{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--yel);display:flex;align-items:center;justify-content:center}
.nrow .ni svg{width:15px;height:15px;margin-left:2px}
.storybtn{display:flex;align-items:center;gap:14px;background:var(--yel);border-radius:22px;padding:14px 16px;margin-top:12px;cursor:pointer;border:none;width:100%;text-align:left}
.storybtn .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--yel);display:flex;align-items:center;justify-content:center;font-size:22px}
.storybtn b{display:block;font-size:15px}
.storybtn small{display:block;font-size:12px;color:#5E4A00;margin-top:2px;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app.reveal > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app.reveal > *:nth-child(2){animation-delay:.05s}
#app.reveal > *:nth-child(3){animation-delay:.1s}
#app.reveal > *:nth-child(4){animation-delay:.15s}
#app.reveal > *:nth-child(5){animation-delay:.2s}
#app.reveal > *:nth-child(n+6){animation-delay:.25s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(33,28,23,.94);color:#FFF8EC;padding:11px 18px;border-radius:99px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}

#story{position:fixed;inset:0;z-index:30;background:#14110E;color:#FFF8EC;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
#story .top{display:flex;justify-content:space-between;align-items:center;max-width:520px;width:100%;margin:0 auto}
#story .top b{font-size:16px}
#story .top em{font-family:var(--serif);font-size:13px;color:var(--yel);display:block}
#story .x{background:rgba(255,248,236,.1);border:none;color:#FFF8EC;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.stwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 0}
#stc{height:100%;max-height:100%;width:auto;max-width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none;cursor:grab;background:#222}
.stctl{max-width:520px;width:100%;margin:0 auto}
.strow{display:flex;gap:8px;align-items:center;margin-top:8px}
.strow .seg{background:rgba(255,248,236,.1)}
.strow .seg button{color:rgba(255,248,236,.6);padding:8px 4px;font-size:13px}
.strow .seg button.on{background:#FFF8EC;color:var(--ink)}
.sl2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:rgba(255,248,236,.65);font-weight:600}
.sl2 span{width:52px;flex:none}
.sl2 input{margin:0;padding:0;border:none;background:none;accent-color:var(--yel)}
.pick{flex:1;color:#FFF8EC;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,248,236,.1);border-radius:14px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;font-size:15px;margin:6px 0 8px;background:var(--bg);font-family:inherit;color:var(--ink);min-height:110px;resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:var(--ink);background:#fff}
.vid{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin-top:12px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  if (a === 'newSong') { FORM = {type: 'song', orig: null}; go('form'); return; }
  if (a === 'editSong') { FORM = {type: 'song', orig: PARAM}; go('form'); return; }
  if (a === 'addUnknown') { FORM = {type: 'song', orig: null, name: PARAM}; go('form'); return; }

  if (a === 'addMsg') {
    const text = val('mText'), name = val('mName');
    if (!text) { toast('한마디를 적어줘'); return; }
    if (name) { MYNAME = name; try { localStorage.setItem('gx_name', name); } catch (e) {} }
    const tm = nowStr();
    document.getElementById('mText').blur();
    call(function () { D.messages.push({'시간': tm, '이름': name, '내용': text}); }, 'addMessage', [name, text, tm], '남겼어 💬');
    return;
  }
  if (a === 'delMsg') {
    if (CONFIRM !== 'delMsg:' + id) { CONFIRM = 'delMsg:' + id; render(); return; }
    const m = D.messages.filter(function (x) { return msgKey(x) === id; })[0];
    if (!m) { CONFIRM = null; render(); return; }
    call(function () { D.messages = D.messages.filter(function (x) { return x !== m; }); CONFIRM = null; }, 'deleteMessage', [m['시간'], m['이름'] || '', m['내용']], '삭제 완료');
    return;
  }
  if (a === 'saveShow') {
    const s = {'날짜': val('f_date'), '회차': val('f_round'), '시간': val('f_time'), '공연명': val('f_name'), '장소': val('f_venue'), '예매 링크': val('f_link'), '예매 오픈일': val('f_open'), '비고': val('f_note'), '영상': val('f_video')};
    if (!s['날짜'] || !s['공연명']) { toast('날짜랑 공연명은 꼭 적어줘'); return; }
    const orig = FORM.orig, nk = key(s['날짜'], s['회차']);
    if (nk !== orig && D.showMap[nk]) { toast('같은 날짜·회차 공연이 이미 있어'); return; }
    document.activeElement && document.activeElement.blur();
    call(function () {
      if (orig) {
        const i = D.shows.findIndex(function (x) { return x.k === orig; });
        if (i >= 0) D.shows[i] = s; else D.shows.push(s);
        if (orig !== nk) { const p = orig.split('|'); D.sets.concat(D.reviews).forEach(function (r) { if (sameKey(r, p)) { r['날짜'] = s['날짜']; r['회차'] = s['회차']; } }); }
        HIST.pop();
      } else D.shows.push(s);
      VIEW = 'show'; PARAM = nk; FORM = null; REVEAL = true; window.scrollTo(0, 0);
    }, 'saveShow', [orig || '', s], orig ? '수정 완료' : '공연 추가 완료');
    return;
  }
  if (a === 'saveSong') {
    const s = {'곡명': val('s_name'), '앨범': val('s_album'), '발매일': val('s_rel'), '링크': val('s_link')};
    if (!s['곡명']) { toast('곡명은 꼭 적어줘'); return; }
    const orig = FORM.orig;
    if (s['곡명'] !== orig && D.songs.some(function (x) { return x['곡명'] === s['곡명']; })) { toast('이미 있는 곡이야'); return; }
    document.activeElement && document.activeElement.blur();
    call(function () {
      if (orig) {
        const i = D.songs.findIndex(function (x) { return x['곡명'] === orig; });
        if (i >= 0) D.songs[i] = s; else D.songs.push(s);
        if (orig !== s['곡명']) D.sets.forEach(function (r) { if (r['곡명'] === orig) r['곡명'] = s['곡명']; });
        HIST.pop();
      } else D.songs.push(s);
      VIEW = 'song'; PARAM = s['곡명']; FORM = null; REVEAL = true; window.scrollTo(0, 0);
    }, 'saveSong', [orig || '', s], orig ? '수정 완료' : '곡 추가 완료');
    return;
  }
  if (a === 'delShow') {
    if (CONFIRM !== 'delShow') { CONFIRM = 'delShow'; render(); return; }
    const k = PARAM, p = k.split('|');
    call(function () {
      D.shows = D.shows.filter(function (x) { return x.k !== k; });
      D.sets = D.sets.filter(function (r) { return !sameKey(r, p); });
      D.reviews = D.reviews.filter(function (r) { return !sameKey(r, p); });
      CONFIRM = null; const h = HIST.pop(); VIEW = h ? h[0] : 'shows'; PARAM = h ? h[1] : null; REVEAL = true; window.scrollTo(0, 0);
    }, 'deleteShow', [k], '삭제 완료');
    return;
  }
  if (a === 'delSong') {
    if (CONFIRM !== 'delSong') { CONFIRM = 'delSong'; render(); return; }
    const n = PARAM;
    call(function () {
      D.songs = D.songs.filter(function (x) { return x['곡명'] !== n; });
      CONFIRM = null; const h = HIST.pop(); VIEW = h ? h[0] : 'songs'; PARAM = h ? h[1] : null; REVEAL = true; window.scrollTo(0, 0);
    }, 'deleteSong', [n], '삭제 완료');
    return;
  }
  if (a === 'editSet') { SETEDIT = {items: (D.setBy[PARAM] || []).map(function (r) { return {name: r['곡명'], encore: r['앵콜'] === 'O', memo: r['메모'] || '', time: r['타임'] || ''}; })}; render(); return; }
  if (a === 'cancelSet') { SETEDIT = null; render(); return; }
  if (a === 'addItem') { SETEDIT.items.push({name: id, encore: false, memo: ''}); render(); return; }
  if (a === 'addFree') { const n = val('freeSong'); if (!n) return; SETEDIT.items.push({name: n, encore: false, memo: ''}); render(); return; }
  if (a === 'up' || a === 'down') { const i = Number(id), j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= SETEDIT.items.length) return; const tmp = SETEDIT.items[i]; SETEDIT.items[i] = SETEDIT.items[j]; SETEDIT.items[j] = tmp; render(); return; }
  if (a === 'enc') { const it = SETEDIT.items[Number(id)]; it.encore = !it.encore; render(); return; }
  if (a === 'del') { SETEDIT.items.splice(Number(id), 1); render(); return; }
  if (a === 'saveSet') {
    const p = PARAM.split('|'), items = SETEDIT.items.slice();
    call(function () {
      D.sets = D.sets.filter(function (r) { return !sameKey(r, p); });
      items.forEach(function (it, i) { D.sets.push({'날짜': p[0], '회차': p[1] || '', '순서': String(i + 1), '곡명': it.name, '앵콜': it.encore ? 'O' : 'X', '메모': it.memo || '', '타임': it.time || ''}); });
      const have = {};
      D.songs.forEach(function (g) { have[g['곡명']] = true; });
      items.forEach(function (it) { if (!have[it.name]) { have[it.name] = true; D.songs.push({'곡명': it.name, '앨범': '', '발매일': ''}); } });
      SETEDIT = null;
    }, 'saveSet', [p[0], p[1] || '', items], '셋리 저장 완료');
    return;
  }
}

// 공계 아이콘: 폰에서는 인스타·유튜브 앱으로 바로 열고, 앱이 없으면 웹으로
const APPS = {
  ig: {ios: 'instagram://user?username=garlixx', and: 'intent://instagram.com/_u/garlixx#Intent;package=com.instagram.android;scheme=https;'},
  yt: {ios: 'youtube://www.youtube.com/@garlixxofficial', and: 'intent://www.youtube.com/@garlixxofficial#Intent;package=com.google.android.youtube;scheme=https;'}
};
function openApp(a) {
  const ap = APPS[a.dataset.app], ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), and = /Android/.test(ua);
  if (!ap || (!ios && !and)) return false;
  if (and) { location.href = ap.and + 'S.browser_fallback_url=' + encodeURIComponent(a.href) + ';end'; return true; }
  const t0 = Date.now();
  const timer = setTimeout(function () { if (!document.hidden && Date.now() - t0 < 2500) location.href = a.href; }, 1200);
  document.addEventListener('visibilitychange', function h() { if (document.hidden) { clearTimeout(timer); document.removeEventListener('visibilitychange', h); } });
  location.href = ap.ios;
  return true;
}
document.addEventListener('click', function (e) {
  const sns = e.target.closest('.sns[data-app]');
  if (sns && openApp(sns)) { e.preventDefault(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { tab(t.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (b) { act(b.dataset.act, b.dataset.id); return; }
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go, g.dataset.id);
});
document.addEventListener('input', function (e) {
  const id = e.target.id;
  if (STORY && (id === 'stdim' || id === 'stzoom' || id === 'stpos')) {
    const v = Number(e.target.value) / 100;
    if (id === 'stdim') STORY.dim = v; else if (id === 'stzoom') STORY.zoom = v; else STORY.pos = v;
    drawPreview();
    return;
  }
  if (id === 'q') { SEARCH = e.target.value; const box = document.getElementById('songlist'); if (box) box.innerHTML = songListHtml(); return; }
  const m = e.target.dataset ? e.target.dataset.memo : undefined;
  if (m !== undefined && SETEDIT) SETEDIT.items[Number(m)].memo = e.target.value;
  const tm = e.target.dataset ? e.target.dataset.time : undefined;
  if (tm !== undefined && SETEDIT) SETEDIT.items[Number(tm)].time = e.target.value.trim();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'stfile' && e.target.files && e.target.files[0]) loadStoryPhoto(e.target.files[0]);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'mText') { e.preventDefault(); act('addMsg'); }
  if (e.key === 'Enter' && e.target.id === 'q') { e.target.blur(); }
  if (e.key === 'Escape' && STORY) closeStory();
});
// 로고 5번 연타 → 관리자 모드 (방문 기록 보기, 내 방문은 집계 제외)
document.getElementById('logo').addEventListener('click', function () {
  const now = Date.now();
  TAPS = TAPS.filter(function (x) { return now - x < 3000; });
  TAPS.push(now);
  if (TAPS.length < 5) return;
  TAPS = [];
  ME = !ME;
  try { if (ME) localStorage.setItem('gx_me', '1'); else localStorage.removeItem('gx_me'); } catch (e) {}
  toast(ME ? '👀 관리자 모드 ON · 이 폰은 방문 집계에서 빠져' : '관리자 모드 OFF');
  VISITS = null;
  tab('home');
  loadVisits();
});

render();
try { const c = localStorage.getItem('gx_cache'); if (c) { D = JSON.parse(c); build(); render(); } } catch (e) { D = null; }
load();
logVisitLater();
loadVisits();
</script>
